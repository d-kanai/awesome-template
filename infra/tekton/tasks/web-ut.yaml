# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🧪 Web Unit Test Task
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 📦 Vitest でユニットテスト + カバレッジを実行
# 📍 git-clone Task の後に実行 (lint と並列可)
# 📊 Results: coverage-summary をダッシュボードに表示
#
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: web-ut
spec:
  params:
    - name: pnpm-version
      type: string
      default: "10.10.0"
      description: "📦 pnpm バージョン"

  # 🗂️ ソースコードを受け取る workspace
  workspaces:
    - name: source
      description: "クローン済みソースコード"

  # 📊 結果 (Dashboard に表示)
  results:
    - name: test-result
      description: "テスト結果 (passed/total)"
    - name: coverage
      description: "カバレッジ (%)"

  steps:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # 📦 Step 1: Install Dependencies
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: install-deps
      image: node:22.21.1-alpine
      script: |
        #!/bin/sh
        set -e
        cd $(workspaces.source.path)/source/frontend_web
        corepack enable && corepack prepare pnpm@$(params.pnpm-version) --activate
        echo "📦 Installing dependencies..."
        pnpm install --frozen-lockfile
        echo "✅ Dependencies installed!"

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # 🧪 Step 2: Run Unit Tests with Coverage
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: vitest-coverage
      image: node:22.21.1-alpine
      script: |
        #!/bin/sh
        set -e
        cd $(workspaces.source.path)/source/frontend_web
        corepack enable && corepack prepare pnpm@$(params.pnpm-version) --activate

        echo "🧪 Running unit tests with coverage..."

        # カバレッジ付きで実行 (json-summary レポーター追加)
        pnpm vitest run --coverage --coverage.reporter=json-summary --reporter=json --outputFile=test-results.json 2>&1 | tee test-output.txt

        # テスト結果をパース
        if [ -f test-results.json ]; then
          PASSED=$(cat test-results.json | grep -o '"numPassedTests":[0-9]*' | grep -o '[0-9]*' || echo "0")
          TOTAL=$(cat test-results.json | grep -o '"numTotalTests":[0-9]*' | grep -o '[0-9]*' || echo "0")
        else
          PASSED=$(grep -o '[0-9]* passed' test-output.txt | grep -o '[0-9]*' || echo "0")
          TOTAL=$PASSED
        fi

        # カバレッジ (Lines %) を取得
        if [ -f coverage/coverage-summary.json ]; then
          # "total":{"lines":{"pct":NN.NN}...} から lines.pct を抽出
          COVERAGE=$(grep -o '"lines":{[^}]*}' coverage/coverage-summary.json | head -1 | grep -o '"pct":[0-9.]*' | grep -o '[0-9.]*' || echo "N/A")
        else
          COVERAGE="N/A"
        fi

        # Tekton Results に書き出し
        echo -n "${PASSED}/${TOTAL}" > $(results.test-result.path)
        echo -n "${COVERAGE}%" > $(results.coverage.path)

        echo ""
        echo "✅ Tests: ${PASSED}/${TOTAL}"
        echo "📊 Coverage: ${COVERAGE}%"
