# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 📦 Web Install Task
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 📦 pnpm install + Playwright browsers
# 📍 git-clone Task の後に実行
# 📍 lint/ut/e2e-mock の前に実行
#
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: web-install
spec:
  params:
    - name: pnpm-version
      type: string
      default: "10.10.0"
      description: "📦 pnpm バージョン"

  # 🗂️ ソースコードを受け取る workspace
  workspaces:
    - name: source
      description: "クローン済みソースコード"

  steps:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # 📦 Install Dependencies + Playwright
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: install
      image: node:22.21.1-bookworm
      script: |
        #!/bin/bash
        set -e
        cd $(workspaces.source.path)/source/frontend_web
        corepack enable && corepack prepare pnpm@$(params.pnpm-version) --activate

        echo "📦 Installing dependencies..."
        pnpm install --frozen-lockfile

        echo "✅ Dependencies installed!"
