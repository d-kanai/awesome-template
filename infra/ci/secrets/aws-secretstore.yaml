# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🔐 AWS Secrets Manager 接続設定
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 📍 用途: External Secrets Operator が AWS Secrets Manager と通信するための設定
# 🌏 対象: クラスタ全体 (ClusterSecretStore)
#
# 📋 前提条件:
#   1. 🛠️ ESO インストール済み:
#      helm install external-secrets external-secrets/external-secrets \
#        -n external-secrets --create-namespace
#
#   2. 🔑 AWS 認証設定済み (以下のいずれか):
#      - IRSA (EKS): ServiceAccount に IAM Role を紐付け
#      - Pod Identity (EKS): より新しい方式
#      - OpenShift: STS による一時クレデンシャル
#
# 使い方:
#   kubectl apply -f infra/tekton/secrets/aws-secretstore.yaml
#
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      # 🔧 AWS サービス指定
      service: SecretsManager

      # 🗾 リージョン (東京)
      region: ap-northeast-1

      # 🔐 認証設定
      # IRSA/Pod Identity を使う場合は auth セクション不要
      # (Pod の ServiceAccount の IAM Role で自動認証)
      #
      # 💡 明示的に指定する場合:
      # auth:
      #   jwt:
      #     serviceAccountRef:
      #       name: external-secrets-sa
      #       namespace: external-secrets
