# 🚀 このワークフローはバックエンドを AWS ECS Fargate にデプロイします
name: Deploy Backend to ECS Fargate

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
  workflow_dispatch:

jobs:
  deploy:
    if: false  # Temporarily disabled
    name: Build and deploy backend
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC 認証用
      contents: read

    steps:
      # ✅ リポジトリ全体をチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # ☕️ Java 21 セットアップ（Gradle ビルド用）
      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 🔐 AWS 認証（OIDC）
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 📦 ECR ログイン
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 🐳 Docker イメージビルド＆プッシュ
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: awesome-template-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd backend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:latest" >> $GITHUB_OUTPUT
        id: build-image

      # 🔄 ECS サービスを強制的に新しいデプロイメントで更新
      - name: Force ECS service deployment
        run: |
          aws ecs update-service \
            --cluster awesome-template-backend-cluster \
            --service awesome-template-backend-service \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}

      # ⏳ デプロイメントが安定するまで待機
      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster awesome-template-backend-cluster \
            --services awesome-template-backend-service \
            --region ${{ secrets.AWS_REGION }}

      # 📝 タスクのパブリックIPを取得
      - name: Get task public IP
        id: get-ip
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster awesome-template-backend-cluster \
            --service-name awesome-template-backend-service \
            --region ${{ secrets.AWS_REGION }} \
            --query 'taskArns[0]' \
            --output text)

          ENI_ID=$(aws ecs describe-tasks \
            --cluster awesome-template-backend-cluster \
            --tasks $TASK_ARN \
            --region ${{ secrets.AWS_REGION }} \
            --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' \
            --output text)

          PUBLIC_IP=$(aws ec2 describe-network-interfaces \
            --network-interface-ids $ENI_ID \
            --region ${{ secrets.AWS_REGION }} \
            --query 'NetworkInterfaces[0].Association.PublicIp' \
            --output text)

          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

      # 📄 デプロイ結果を Step Summary に表示
      - name: Publish deployment summary
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: awesome-template-backend
          PUBLIC_IP: ${{ steps.get-ip.outputs.public_ip }}
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### 🚀 Backend Deployment Successful

          - **Image**: \`${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}\`
          - **Backend URL**: http://${PUBLIC_IP}:8080
          - **Health Check**: http://${PUBLIC_IP}:8080/actuator/health
          - **Deployed at**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF
