# 🧪 このワークフローは React Native アプリのE2Eテストを実行します
name: Native E2E

on:
  workflow_call:
    inputs:
      apk_url:
        description: 'APK download URL'
        required: true
        type: string
      build_id:
        description: 'EAS Build ID'
        required: true
        type: string
    secrets:
      MAESTRO_CLOUD_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK download URL'
        required: true
        type: string
      build_id:
        description: 'EAS Build ID'
        required: true
        type: string

jobs:
  e2e:
    name: Run E2E tests on Maestro Cloud
    runs-on: ubuntu-latest

    steps:
      # ✅ リポジトリ全体をチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 📥 APK をダウンロード
      - name: Download APK
        run: |
          curl -L -o app.apk "${{ inputs.apk_url }}"
          ls -lh app.apk

      # 🧪 Maestro Cloud でE2Eテスト実行
      - name: Run E2E tests on Maestro Cloud
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          export PATH="$PATH:$HOME/.maestro/bin"

          cd frontend_native
          maestro cloud \
            --apiKey ${{ secrets.MAESTRO_CLOUD_API_KEY }} \
            --env BACKEND_URL=http://18.183.26.104:8080 \
            ../app.apk \
            e2e

      # 📄 E2E結果を Step Summary に表示
      - name: Publish E2E summary
        if: always()
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### 🧪 Native E2E Test Results

          - **Build ID**: \`${{ inputs.build_id }}\`
          - **APK URL**: ${{ inputs.apk_url }}
          - **Backend URL**: http://18.183.26.104:8080
          - **Tested at**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF
