# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🚀 Web CI Pipeline
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 📦 Next.js アプリの CI パイプライン
#
# 🔄 実行フロー:
#                              ┌─── quality-lint ──────┐
#                              ├─── test-ut ───────────┤
#   clone ─── install ─────────┼─── test-e2e-mock ─────┼── build ── image-scan
#                              ├─── security-pnpm-audit┤
#                              ├─── security-pkg-scan ─┤
#                              ├─── security-secret-scan
#                              └─── security-sast ─────┘
#
# 使い方:
#   kubectl apply -f infra/tekton/tasks/
#   kubectl apply -f infra/tekton/pipelines/web-ci.yaml
#   kubectl create -f infra/tekton/pipelineruns/web-ci.yaml
#
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: web-ci
spec:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 📝 パラメータ (すべてデフォルト値あり)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  params:
    - name: repo-url
      type: string
      default: https://github.com/d-kanai/awesome-template.git
      description: "📂 Git リポジトリ URL"
    - name: branch
      type: string
      default: main
      description: "🌿 ブランチ名"
    - name: image-name
      type: string
      default: kind-registry:5000/awesome-template/web
      description: "🐳 Docker イメージ名 (レジストリ含む)"
    - name: image-tag
      type: string
      default: latest
      description: "🏷️ イメージタグ"
    - name: pnpm-version
      type: string
      default: "10.10.0"
      description: "📦 pnpm バージョン"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🗂️ 共有 Workspace
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  workspaces:
    - name: shared-workspace
      description: "Task 間で共有するワークスペース"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🔧 Tasks
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  tasks:
    # ─────────────────────────────────────────────
    # Stage 1: Clone
    # ─────────────────────────────────────────────
    - name: clone
      taskRef:
        name: git-clone
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)
      workspaces:
        - name: output
          workspace: shared-workspace

    # ─────────────────────────────────────────────
    # Stage 2: Install
    # ─────────────────────────────────────────────
    - name: install
      taskRef:
        name: web-install
      runAfter:
        - clone
      params:
        - name: pnpm-version
          value: $(params.pnpm-version)
      workspaces:
        - name: source
          workspace: shared-workspace

    # ─────────────────────────────────────────────
    # Stage 3: Parallel Checks (7 tasks)
    # ─────────────────────────────────────────────

    # 📋 Quality: Lint (typecheck + biome)
    - name: quality-lint
      taskRef:
        name: web-quality-lint
      runAfter:
        - install
      params:
        - name: pnpm-version
          value: $(params.pnpm-version)
      workspaces:
        - name: source
          workspace: shared-workspace

    # 🧪 Test: Unit Test (vitest)
    - name: test-ut
      taskRef:
        name: web-test-ut
      runAfter:
        - install
      params:
        - name: pnpm-version
          value: $(params.pnpm-version)
      workspaces:
        - name: source
          workspace: shared-workspace

    # 🧪 Test: E2E Test (Cucumber + Playwright, Mock Mode)
    - name: test-e2e-mock
      taskRef:
        name: web-test-e2e-mock
      runAfter:
        - install
      params:
        - name: pnpm-version
          value: $(params.pnpm-version)
      workspaces:
        - name: source
          workspace: shared-workspace

    # 🔒 Security: pnpm audit (dependency vulnerabilities)
    - name: security-pnpm-audit
      taskRef:
        name: web-security-pnpm-audit
      runAfter:
        - install
      params:
        - name: pnpm-version
          value: $(params.pnpm-version)
      workspaces:
        - name: source
          workspace: shared-workspace

    # 🔒 Security: Package Scan (Trivy - filesystem vulnerabilities)
    - name: security-pkg-scan
      taskRef:
        name: web-security-pkg-scan
      runAfter:
        - install
      workspaces:
        - name: source
          workspace: shared-workspace

    # 🔒 Security: Secret Scan (Gitleaks - credential detection)
    - name: security-secret-scan
      taskRef:
        name: web-security-secret-scan
      runAfter:
        - install
      workspaces:
        - name: source
          workspace: shared-workspace

    # 🔒 Security: SAST (Semgrep - static analysis)
    - name: security-sast
      taskRef:
        name: web-security-sast
      runAfter:
        - install
      workspaces:
        - name: source
          workspace: shared-workspace

    # ─────────────────────────────────────────────
    # Stage 4: Build (after all checks pass)
    # ─────────────────────────────────────────────
    - name: build
      taskRef:
        name: web-build
      runAfter:
        - quality-lint
        - test-ut
        - test-e2e-mock
        - security-pnpm-audit
        - security-pkg-scan
        - security-secret-scan
        - security-sast
      params:
        - name: image-name
          value: $(params.image-name)
        - name: image-tag
          value: $(params.image-tag)
      workspaces:
        - name: source
          workspace: shared-workspace

    # ─────────────────────────────────────────────
    # Stage 5: Image Scan (after build)
    # ─────────────────────────────────────────────
    - name: security-image-scan
      taskRef:
        name: web-security-image-scan
      runAfter:
        - build
      params:
        - name: image-name
          value: $(params.image-name)
        - name: image-tag
          value: $(params.image-tag)
