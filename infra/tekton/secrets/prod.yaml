# 本番用 ExternalSecret
# AWS Secrets Manager から自動同期
#
# AWS側の Secret 形式 (JSON):
# {
#   "ANALYZE": "false",
#   "NEXT_PUBLIC_API_BASE_URL": "https://api.example.com",
#   "NEXT_PUBLIC_API_MOCK_MODE": "false",
#   "NEXT_PUBLIC_API_TIMEOUT_MS": "30000",
#   "NODE_ENV": "production",
#   "LOG_LEVEL": "info"
# }
#
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: web-build-env
  namespace: tekton-pipelines  # Tekton が動く namespace
spec:
  refreshInterval: 1h  # 1時間ごとに同期

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: web-build-env  # 生成される K8s Secret 名
    creationPolicy: Owner

  # AWS Secrets Manager のキー名
  dataFrom:
    - extract:
        key: prod/awesome-template/web-build
