# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🏠 ローカル開発用 Secret
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 📍 用途: kind クラスタでの開発・テスト用
# ⚠️  注意: 本番では使わない！ → prod.yaml (ExternalSecret) を使用
#
# 使い方:
#   kubectl apply -f infra/ci/secrets/local.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: web-build-env
  # 📝 namespace 未指定 = default または kubectl の現在の context
type: Opaque
stringData:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🔨 ビルド時環境変数
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ⚠️  NEXT_PUBLIC_* は JavaScript にインライン化される
  #    → ビルド後は変更不可！

  # 📊 バンドル解析 (true にすると .next/analyze に出力)
  ANALYZE: "false"

  # 🌐 API エンドポイント (ローカル開発用)
  NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"

  # 🎭 モックモード (true = MSW でモックレスポンス)
  NEXT_PUBLIC_API_MOCK_MODE: "true"

  # ⏱️ API タイムアウト (ミリ秒)
  NEXT_PUBLIC_API_TIMEOUT_MS: "30000"

  # 🐢 Slow Request 閾値 (ミリ秒、超過時に warn ログ)
  NEXT_PUBLIC_API_SLOW_THRESHOLD_MS: "3000"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🚀 起動時環境変数
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # サーバーサイドで参照 (実行時に変更可能)

  # 🌍 Node.js 環境
  NODE_ENV: "production"

  # 📝 ログレベル (debug/info/warn/error)
  LOG_LEVEL: "debug"
