apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: web-security-secret-scan
  namespace: default
spec:
  description: "Gitleaks - シークレット漏洩検出"
  workspaces:
    - name: source
      description: "クローン済みソースコード"
  steps:
    - name: gitleaks-detect
      image: zricethezav/gitleaks:latest
      workingDir: $(workspaces.source.path)/source
      args:
        - detect
        - --source
        - .
        - --verbose
        - --exit-code
        - "1"
