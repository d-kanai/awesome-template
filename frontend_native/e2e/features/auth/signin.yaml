appId: con.example.awesome
name: サインイン
onFlowStart:
  - runScript: ../../scripts/reset_backend.js
  - runScript:
      file: ../../scripts/setup_data.js
      env:
        TABLE_NAME: user
---
# Given: ユーザーレコードを作成
- clearKeychain
- launchApp:
    clearState: true

# Wait for signin screen to load
- runFlow:
    file: ../../flows/wait_visible.yaml
    env:
      VISIBLE_TEXT: "Sign In"

# When: サインイン
- tapOn:
    id: signin-email
- inputText:
    text: "test@example.com"
    delayBetweenKeystrokes: 0
- tapOn:
    id: signin-password
- inputText:
    text: "TestPassword123"
    delayBetweenKeystrokes: 0
- tapOn:
    id: signin-submit
- tapOn:
    text: "OK"

# Then: ユーザー一覧画面を表示
- runFlow:
    file: ../../flows/wait_visible.yaml
    env:
      VISIBLE_TEXT: "ユーザー一覧"
- runFlow:
    file: ../../flows/wait_visible.yaml
    env:
      VISIBLE_TEXT: "test@example.com"
