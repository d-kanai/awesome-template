appId: con.example.awesome
name: ユーザー一覧表示
onFlowStart:
  - runScript: ../../scripts/reset_backend.js
  - runScript:
      file: ../../scripts/setup_data.js
      env:
        TABLE_NAME: user
---
# Given: テストユーザーを事前登録してアプリを起動
# アプリ起動時にAuthContextが自動的にtest tokenを取得・設定
- clearKeychain
- launchApp

# When: 自動ログインでユーザー一覧画面に遷移するまで待機
- runFlow:
    file: ../../flows/wait_visible.yaml
    env:
      VISIBLE_TEXT: "ユーザー一覧"

# Then: 登録済みユーザーが一覧に表示される
- runFlow:
    file: ../../flows/wait_visible.yaml
    env:
      VISIBLE_TEXT: "test@example.com"
