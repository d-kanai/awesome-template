# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 📦 Kustomization - Web Frontend
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: web

commonLabels:
  app.kubernetes.io/part-of: awesome-template
  app.kubernetes.io/managed-by: argocd

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml

# イメージタグはArgoCD Image Updaterで自動更新
images:
  - name: IMAGE_REGISTRY/awesome-template/web
    newName: IMAGE_REGISTRY/awesome-template/web
    newTag: latest
