# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 📥 Git Clone Task
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 🔧 リポジトリをクローンして workspace に配置
# 📍 Pipeline の最初のステップとして使用
#
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  params:
    - name: repo-url
      type: string
      description: "📂 Git リポジトリ URL"
    - name: revision
      type: string
      default: main
      description: "🌿 ブランチ名またはコミットハッシュ"

  # 🗂️ クローン結果を出力する workspace
  workspaces:
    - name: output
      description: "クローンしたソースコードの出力先"

  steps:
    - name: clone
      image: alpine/git:2.43.0
      script: |
        #!/bin/sh
        set -e
        echo "📥 Cloning $(params.repo-url) @ $(params.revision)..."
        git clone --depth 1 --branch $(params.revision) $(params.repo-url) $(workspaces.output.path)/source
        echo "✅ Clone complete!"
        ls -la $(workspaces.output.path)/source
