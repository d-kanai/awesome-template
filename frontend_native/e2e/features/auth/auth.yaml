appId: con.example.awesome
name: Auth (サインアップ, サインイン)
onFlowStart:
  - runScript: ../../scripts/reset_backend.js
---
# ========== サインアップテスト ==========
# Given: アプリを起動してサインイン画面を表示
- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    file: ../../flows/wait_visible.yaml
    env:
      VISIBLE_TEXT: "Sign In"

# When: サインアップ画面に遷移してユーザー登録
- tapOn:
    id: signin-signup-link
- runFlow:
    file: ../../flows/wait_visible.yaml
    env:
      VISIBLE_TEXT: "Sign Up"
- tapOn:
    id: signup-email
- inputText:
    text: "maestro@example.com"
    delayBetweenKeystrokes: 0
- tapOn:
    id: signup-password
- inputText:
    text: "SecurePassword123"
    delayBetweenKeystrokes: 0
- tapOn:
    id: signup-submit
- tapOn:
    text: "OK"

# Then: サインイン画面に戻る
- runFlow:
    file: ../../flows/wait_visible.yaml
    env:
      VISIBLE_TEXT: "Sign In"

# ========== サインインテスト ==========
# Given: テストユーザーを事前登録してアプリを起動
- runScript: ../../scripts/reset_backend.js
- runScript:
    file: ../../scripts/setup_data.js
    env:
      TABLE_NAME: user
- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    file: ../../flows/wait_visible.yaml
    env:
      VISIBLE_TEXT: "Sign In"

# When: 登録済みユーザーでサインイン
- tapOn:
    id: signin-email
- inputText:
    text: "test@example.com"
    delayBetweenKeystrokes: 0
- tapOn:
    id: signin-password
- inputText:
    text: "TestPassword123"
    delayBetweenKeystrokes: 0
- tapOn:
    id: signin-submit

# Then: ユーザー一覧画面に遷移し、サインインしたユーザーが表示される
- runFlow:
    file: ../../flows/wait_visible.yaml
    env:
      VISIBLE_TEXT: "ユーザー一覧"
- runFlow:
    file: ../../flows/wait_visible.yaml
    env:
      VISIBLE_TEXT: "test@example.com"
