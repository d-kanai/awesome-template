spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      create_pgcrypto_extension: ''
      users_id_uuid_clause: ''
  jooq:
    sql-dialect: H2

server:
  port: 8080
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        # Show more endpoints in test environment for debugging
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized

jwt:
  secret: test-secret-key-that-is-at-least-256-bits-long-for-hs256
  expiration-hours: 720  # 30 days
  cookie:
    name: accessToken
    httpOnly: true
    secure: false  # HTTP for test environment
    sameSite: Lax
    maxAgeSeconds: 2592000  # 30 days (in seconds)

logging:
  level:
    root: WARN
    org.flywaydb.core: WARN
    com.example.demo: INFO
