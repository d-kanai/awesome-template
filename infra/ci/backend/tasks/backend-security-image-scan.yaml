# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🔒 Backend Security Image Scan Task
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 📦 Trivy でビルド済み Docker イメージの脆弱性スキャン
# 📍 backend-build Task の後に実行
#
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: backend-security-image-scan
spec:
  description: "Trivy - Docker イメージ脆弱性スキャン"

  params:
    - name: image-name
      type: string
      description: "🐳 スキャン対象の Docker イメージ名"
    - name: image-tag
      type: string
      default: latest
      description: "🏷️ イメージタグ"

  steps:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # 🔒 Step 1: Trivy Image Scan
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: trivy-image-scan
      image: aquasec/trivy:latest
      script: |
        #!/bin/sh
        echo "🔒 Running Trivy image scan..."
        trivy image \
          --severity CRITICAL,HIGH \
          --exit-code 1 \
          $(params.image-name):$(params.image-tag)
        echo "✅ Image scan passed!"
