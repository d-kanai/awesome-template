spring:
  application:
    name: demo
  datasource:
    url: jdbc:postgresql://localhost:5432/demodb
    username: demo
    password: demo123
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    placeholders:
      create_pgcrypto_extension: 'CREATE EXTENSION IF NOT EXISTS "pgcrypto";'
      users_id_uuid_clause: ' DEFAULT gen_random_uuid()'

server:
  port: 8080
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      show-components: always

jwt:
  secret: ${JWT_SECRET:my-secret-key-that-is-at-least-256-bits-long-for-hs256}
  expiration-hours: 720  # 30 days
  cookie:
    name: accessToken
    httpOnly: true
    secure: ${JWT_COOKIE_SECURE:false}  # true for production (HTTPS), false for development (HTTP)
    sameSite: Lax
    maxAgeSeconds: 2592000  # 30 days (in seconds)

