# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🐳 Web Build Task
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 📦 Next.js アプリを Kaniko でビルドしてレジストリにプッシュ
# 📍 web-lint Task の後に実行
#
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: web-build
spec:
  params:
    - name: image-name
      type: string
      description: "🐳 Docker イメージ名 (レジストリ含む)"
    - name: image-tag
      type: string
      default: latest
      description: "🏷️ イメージタグ"

  # 🗂️ ソースコードを受け取る workspace
  workspaces:
    - name: source
      description: "クローン済みソースコード"

  steps:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # 🐳 Docker Build & Push (Kaniko)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:latest
      # 🔐 環境変数は Secret から注入
      envFrom:
        - secretRef:
            name: web-build-env
      args:
        # 📄 Dockerfile の場所
        - --dockerfile=$(workspaces.source.path)/source/frontend_web/Dockerfile
        - --context=$(workspaces.source.path)/source/frontend_web
        # 🎯 プッシュ先
        - --destination=$(params.image-name):$(params.image-tag)
        # 🔧 ビルド引数 (NEXT_PUBLIC_* は JS に埋め込まれる)
        - --build-arg=NEXT_PUBLIC_API_BASE_URL=$(NEXT_PUBLIC_API_BASE_URL)
        - --build-arg=NEXT_PUBLIC_API_MOCK_MODE=$(NEXT_PUBLIC_API_MOCK_MODE)
        - --build-arg=NEXT_PUBLIC_API_TIMEOUT_MS=$(NEXT_PUBLIC_API_TIMEOUT_MS)
        - --build-arg=ANALYZE=$(ANALYZE)
        # ⚡ レイヤーキャッシュ
        - --cache=true
        - --cache-repo=$(params.image-name)-cache
        # 🏠 ローカルレジストリ用 (HTTP許可)
        # ⚠️  本番では削除すること!
        - --insecure
