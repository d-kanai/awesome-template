# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🔍 Backend Quality Task
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 📦 Checkstyle + PMD + SpotBugs を実行
# 📍 backend-install Task の後に実行
#
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: backend-quality
spec:
  description: "Checkstyle + PMD + SpotBugs - 静的解析"

  workspaces:
    - name: source
      description: "クローン済みソースコード"

  steps:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # 🔍 Step 1: Checkstyle
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: checkstyle
      image: eclipse-temurin:21
      workingDir: $(workspaces.source.path)/source/backend
      env:
        - name: GRADLE_USER_HOME
          value: $(workspaces.source.path)/gradle-cache
      script: |
        #!/bin/sh
        set -e
        echo "🔍 Running Checkstyle..."
        ./gradlew checkstyleMain checkstyleTest --no-daemon
        echo "✅ Checkstyle passed!"

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # 🔍 Step 2: PMD
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: pmd
      image: eclipse-temurin:21
      workingDir: $(workspaces.source.path)/source/backend
      env:
        - name: GRADLE_USER_HOME
          value: $(workspaces.source.path)/gradle-cache
      script: |
        #!/bin/sh
        set -e
        echo "🔍 Running PMD..."
        ./gradlew pmdMain pmdTest --no-daemon
        echo "✅ PMD passed!"

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # 🐛 Step 3: SpotBugs
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: spotbugs
      image: eclipse-temurin:21
      workingDir: $(workspaces.source.path)/source/backend
      env:
        - name: GRADLE_USER_HOME
          value: $(workspaces.source.path)/gradle-cache
      script: |
        #!/bin/sh
        set -e
        echo "🐛 Running SpotBugs..."
        ./gradlew spotbugsMain spotbugsTest --no-daemon
        echo "✅ SpotBugs passed!"
