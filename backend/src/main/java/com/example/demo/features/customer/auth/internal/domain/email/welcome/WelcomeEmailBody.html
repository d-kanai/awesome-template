<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ようこそ</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    .header {
      background-color: #4a90d9;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 8px 8px 0 0;
    }
    .content {
      background-color: #f9f9f9;
      padding: 30px;
      border: 1px solid #ddd;
      border-top: none;
      border-radius: 0 0 8px 8px;
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>ようこそ！</h1>
  </div>
  <div class="content">
    <p>${email} 様</p>
    <p>ご登録いただきありがとうございます。</p>
    <p>サービスをお楽しみください。</p>
  </div>
  <div class="footer">
    <p>このメールは自動送信されています。</p>
  </div>
</body>
</html>
