# ローカル開発用 Secret (kind クラスタ用)
# 本番では使わない - ExternalSecret を使用
apiVersion: v1
kind: Secret
metadata:
  name: web-build-env
type: Opaque
stringData:
  # ビルド時 (NEXT_PUBLIC_* は JS にインライン化)
  ANALYZE: "false"
  NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
  NEXT_PUBLIC_API_MOCK_MODE: "true"
  NEXT_PUBLIC_API_TIMEOUT_MS: "30000"

  # 起動時 (サーバーサイドで参照)
  NODE_ENV: "production"
  LOG_LEVEL: "debug"
