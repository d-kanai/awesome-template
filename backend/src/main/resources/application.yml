spring:
  application:
    name: demo
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    placeholders:
      create_pgcrypto_extension: 'CREATE EXTENSION IF NOT EXISTS "pgcrypto";'
      users_id_uuid_clause: ' DEFAULT gen_random_uuid()'

server:
  port: ${PORT:8080}
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      show-components: always

app:
  env: ${ENV}
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: ${JWT_EXPIRATION_HOURS:720}
    cookie:
      name: accessToken
      http-only: true
      secure: ${JWT_COOKIE_SECURE}
      same-site: Lax
      max-age-seconds: 2592000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
