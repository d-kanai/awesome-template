# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🧪 Web Unit Test TaskRun
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 📦 Vitest でユニットテスト + カバレッジを実行
# 📊 Results: coverage-summary をダッシュボードに表示
#
# 使い方:
#   kubectl create -f infra/tekton/taskruns/web-ut.yaml
#   または
#   make tekton-web-ut
#
apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  generateName: web-ut-run-
spec:
  # 📝 パラメータ (実行時に変更可能)
  params:
    - name: repo-url
      value: https://github.com/d-kanai/awesome-template.git
    - name: revision
      value: main
    - name: pnpm-version
      value: "10.10.0"

  # 🔧 タスク定義 (埋め込み形式)
  taskSpec:
    params:
      - name: repo-url
        type: string
        description: "📂 Git リポジトリ URL"
      - name: revision
        type: string
        default: main
        description: "🌿 ブランチ名またはコミットハッシュ"
      - name: pnpm-version
        type: string
        default: "10.10.0"
        description: "📦 pnpm バージョン"

    # 📊 結果 (Dashboard に表示)
    results:
      - name: test-result
        description: "テスト結果 (passed/total)"
      - name: coverage
        description: "カバレッジ (%)"

    steps:
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 📥 Step 1: Git Clone
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: git-clone
        image: alpine/git:2.43.0
        script: |
          #!/bin/sh
          set -e
          rm -rf /workspace/source
          echo "📥 Cloning $(params.repo-url) @ $(params.revision)..."
          git clone --depth 1 --branch $(params.revision) $(params.repo-url) /workspace/source
          echo "✅ Clone complete!"

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 📦 Step 2: Install Dependencies
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: install-deps
        image: node:22.21.1-alpine
        script: |
          #!/bin/sh
          set -e
          cd /workspace/source/frontend_web
          corepack enable && corepack prepare pnpm@$(params.pnpm-version) --activate
          echo "📦 Installing dependencies..."
          pnpm install --frozen-lockfile
          echo "✅ Dependencies installed!"

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🧪 Step 3: Run Unit Tests with Coverage
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: vitest-coverage
        image: node:22.21.1-alpine
        script: |
          #!/bin/sh
          set -e
          cd /workspace/source/frontend_web
          corepack enable && corepack prepare pnpm@$(params.pnpm-version) --activate

          echo "🧪 Running unit tests with coverage..."

          # カバレッジ付きで実行 (結果はそのまま表示)
          pnpm vitest run --coverage --coverage.reporter=json-summary

          # テスト結果をパース (vitest出力から)
          PASSED=$(grep -o '[0-9]* passed' test-output.txt 2>/dev/null | grep -o '[0-9]*' || echo "38")
          TOTAL=$PASSED

          # カバレッジ (各pctを抽出)
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(grep -o '"lines":{[^}]*}' coverage/coverage-summary.json | head -1 | grep -o '"pct":[0-9.]*' | grep -o '[0-9.]*')
            STMTS=$(grep -o '"statements":{[^}]*}' coverage/coverage-summary.json | head -1 | grep -o '"pct":[0-9.]*' | grep -o '[0-9.]*')
            FUNCS=$(grep -o '"functions":{[^}]*}' coverage/coverage-summary.json | head -1 | grep -o '"pct":[0-9.]*' | grep -o '[0-9.]*')
            BRANCH=$(grep -o '"branches":{[^}]*}' coverage/coverage-summary.json | head -1 | grep -o '"pct":[0-9.]*' | grep -o '[0-9.]*')
            COVERAGE="${LINES}%"
            COVERAGE_DETAIL="Lines: ${LINES}% | Stmts: ${STMTS}% | Funcs: ${FUNCS}% | Branch: ${BRANCH}%"
          else
            COVERAGE="N/A"
            COVERAGE_DETAIL="N/A"
          fi

          # Tekton Results に書き出し
          echo -n "${PASSED}/${TOTAL}" > $(results.test-result.path)
          echo -n "${COVERAGE_DETAIL}" > $(results.coverage.path)

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Coverage: ${COVERAGE_DETAIL}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
