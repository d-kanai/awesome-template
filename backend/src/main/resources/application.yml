spring:
  application:
    name: demo
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:migration
    placeholders:
      create_pgcrypto_extension: 'CREATE EXTENSION IF NOT EXISTS "pgcrypto";'
      users_id_uuid_clause: ' DEFAULT gen_random_uuid()'

server:
  port: ${PORT}
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    kafka:
      enabled: ${KAFKA_ENABLED}

app:
  env: ${ENV}
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: ${JWT_EXPIRATION_HOURS}
    cookie:
      name: accessToken
      http-only: true
      secure: ${JWT_COOKIE_SECURE}
      same-site: Lax
      max-age-seconds: 2592000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  kafka:
    enabled: ${KAFKA_ENABLED}
  email:
    from: ${EMAIL_FROM}
    reply-to: ${EMAIL_REPLY_TO}
  mockoon:
    enabled: ${MOCKOON_ENABLED}
    api-url: ${MOCKOON_API_URL}
  external-api:
    base-url: ${EXTERNAL_API_BASE_URL}

springdoc:
  writer-with-default-pretty-printer: true

spring.kafka:
  bootstrap-servers: ${KAFKA_SERVER_URL}
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    acks: all
    retries: 3
    properties:
      enable.idempotence: true
  consumer:
    group-id: ${spring.application.name}
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring.json.trusted.packages: com.example.demo.*
