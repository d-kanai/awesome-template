# 🚀 Web フロントエンド Docker ビルド TaskRun
# 📦 Next.js アプリをビルドしてコンテナレジストリにプッシュ
#
# 使い方:
#   kubectl create -f infra/tekton/taskruns/web-build.yaml
#   または
#   make tekton-web-build
#
apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  generateName: web-build-run-
spec:
  # 📝 パラメータ (実行時に変更可能)
  params:
    - name: repo-url
      value: https://github.com/d-kanai/awesome-template.git
    - name: revision
      value: main
    - name: image-name
      # 🏠 ローカル: kind-registry:5000/awesome-template/web
      # ☁️  本番:   xxxx.dkr.ecr.ap-northeast-1.amazonaws.com/awesome-template/web
      value: kind-registry:5000/awesome-template/web
    - name: image-tag
      value: latest

  # 🔧 タスク定義 (埋め込み形式)
  taskSpec:
    params:
      - name: repo-url
        type: string
        description: "📂 Git リポジトリ URL"
      - name: revision
        type: string
        default: main
        description: "🌿 ブランチ名またはコミットハッシュ"
      - name: image-name
        type: string
        description: "🐳 Docker イメージ名 (レジストリ含む)"
      - name: image-tag
        type: string
        default: latest
        description: "🏷️ イメージタグ"

    steps:
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 📥 Step 1: Git Clone
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: git-clone
        image: alpine/git:2.43.0
        script: |
          #!/bin/sh
          set -e
          rm -rf /workspace/source
          echo "📥 Cloning $(params.repo-url) @ $(params.revision)..."
          git clone --depth 1 --branch $(params.revision) $(params.repo-url) /workspace/source
          echo "✅ Clone complete!"

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🐳 Step 2: Docker Build & Push (Kaniko)
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: docker-build-and-push
        image: gcr.io/kaniko-project/executor:latest
        # 🔐 環境変数は Secret から注入
        envFrom:
          - secretRef:
              name: web-build-env
        args:
          # 📄 Dockerfile の場所
          - --dockerfile=/workspace/source/frontend_web/Dockerfile
          - --context=/workspace/source/frontend_web
          # 🎯 プッシュ先
          - --destination=$(params.image-name):$(params.image-tag)
          # 🔧 ビルド引数 (NEXT_PUBLIC_* は JS に埋め込まれる)
          - --build-arg=NEXT_PUBLIC_API_BASE_URL=$(NEXT_PUBLIC_API_BASE_URL)
          - --build-arg=NEXT_PUBLIC_API_MOCK_MODE=$(NEXT_PUBLIC_API_MOCK_MODE)
          - --build-arg=NEXT_PUBLIC_API_TIMEOUT_MS=$(NEXT_PUBLIC_API_TIMEOUT_MS)
          - --build-arg=ANALYZE=$(ANALYZE)
          # ⚡ レイヤーキャッシュ (2回目以降が高速化)
          - --cache=true
          - --cache-repo=$(params.image-name)-cache
          # 🏠 ローカルレジストリ用 (HTTP許可)
          # ⚠️  本番では削除すること!
          - --insecure
