# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🔄 ArgoCD Application - Web Frontend
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# このファイルはArgoCD管理下のリポジトリに配置するか、
# ArgoCD UIまたはCLIで手動で作成します
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: awesome-template-web
  namespace: argocd
  # 自動同期のためのアノテーション
  annotations:
    argocd-image-updater.argoproj.io/image-list: web=IMAGE_REGISTRY/awesome-template/web
    argocd-image-updater.argoproj.io/web.update-strategy: semver
spec:
  project: default

  source:
    repoURL: https://github.com/your-org/awesome-template.git
    targetRevision: main
    path: infra/cd/web

  destination:
    server: https://kubernetes.default.svc
    namespace: awesome-template

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
