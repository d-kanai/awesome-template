# Unleash Helm Chart Values
# Chart: https://github.com/Unleash/helm-charts/tree/main/charts/unleash

replicaCount: 1

image:
  repository: unleashorg/unleash-server
  tag: 5.12.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 4242

# Database configuration
postgresql:
  enabled: false  # Use external PostgreSQL

env:
  - name: DATABASE_HOST
    value: postgres
  - name: DATABASE_PORT
    value: "5432"
  - name: DATABASE_NAME
    value: unleash
  - name: DATABASE_USERNAME
    value: unleash
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: unleash-db-credentials
        key: password
  - name: DATABASE_SSL
    value: "false"

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"
