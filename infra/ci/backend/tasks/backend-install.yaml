# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 📦 Backend Install Task
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 📦 Gradle で依存関係をダウンロード + コンパイル
# 📍 git-clone Task の後に実行
#
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: backend-install
spec:
  description: "Gradle - 依存関係ダウンロード + コンパイル"

  workspaces:
    - name: source
      description: "クローン済みソースコード"

  steps:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # 📦 Step 1: Gradle Compile
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: gradle-compile
      image: eclipse-temurin:21
      workingDir: $(workspaces.source.path)/source/backend
      env:
        - name: GRADLE_USER_HOME
          value: $(workspaces.source.path)/gradle-cache
      script: |
        #!/bin/sh
        set -e
        echo "📦 Downloading dependencies and compiling..."
        mkdir -p $(workspaces.source.path)/gradle-cache
        ./gradlew compileJava compileTestJava --no-daemon
        echo "✅ Compile completed!"
