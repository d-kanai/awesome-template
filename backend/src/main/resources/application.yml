spring:
  application:
    name: demo
  datasource:
    url: jdbc:postgresql://localhost:5432/demodb
    username: demo
    password: demo123
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    placeholders:
      create_pgcrypto_extension: 'CREATE EXTENSION IF NOT EXISTS "pgcrypto";'
      users_id_uuid_clause: ' DEFAULT gen_random_uuid()'

server:
  port: 8080
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        # Only expose health endpoint in production
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

jwt:
  secret: ${JWT_SECRET:my-secret-key-that-is-at-least-256-bits-long-for-hs256}
  expiration-hours: 720  # 30 days

unleash:
  api-url: ${UNLEASH_API_URL:http://localhost:4242/api}
  api-token: ${UNLEASH_API_TOKEN:default:development.unleash-insecure-api-token}
  app-name: ${UNLEASH_APP_NAME:awesome-template-backend}
  environment: ${UNLEASH_ENVIRONMENT:development}
  enabled: true
