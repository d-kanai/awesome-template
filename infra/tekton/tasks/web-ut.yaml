# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🧪 Web Unit Test Task
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 📦 Vitest でユニットテスト + カバレッジを実行
# 📍 git-clone Task の後に実行 (lint と並列可)
# 📊 Results: coverage-summary をダッシュボードに表示
#
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: web-ut
spec:
  params:
    - name: pnpm-version
      type: string
      default: "10.10.0"
      description: "📦 pnpm バージョン"

  # 🗂️ ソースコードを受け取る workspace
  workspaces:
    - name: source
      description: "クローン済みソースコード"

  # 📊 結果 (Dashboard に表示)
  results:
    - name: coverage-summary
      description: "カバレッジサマリー"
    - name: tests-passed
      description: "パスしたテスト数"
    - name: tests-total
      description: "総テスト数"

  steps:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # 📦 Step 1: Install Dependencies
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: install-deps
      image: node:22.21.1-alpine
      script: |
        #!/bin/sh
        set -e
        cd $(workspaces.source.path)/source/frontend_web
        corepack enable && corepack prepare pnpm@$(params.pnpm-version) --activate
        echo "📦 Installing dependencies..."
        pnpm install --frozen-lockfile
        echo "✅ Dependencies installed!"

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # 🧪 Step 2: Run Unit Tests with Coverage
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: vitest-coverage
      image: node:22.21.1-alpine
      script: |
        #!/bin/sh
        set -e
        cd $(workspaces.source.path)/source/frontend_web
        corepack enable && corepack prepare pnpm@$(params.pnpm-version) --activate

        echo "🧪 Running unit tests with coverage..."

        # カバレッジ付きで実行、JSON レポート出力
        pnpm vitest run --coverage --reporter=json --outputFile=test-results.json 2>&1 | tee test-output.txt

        # テスト結果をパース
        if [ -f test-results.json ]; then
          PASSED=$(cat test-results.json | grep -o '"numPassedTests":[0-9]*' | grep -o '[0-9]*' || echo "0")
          TOTAL=$(cat test-results.json | grep -o '"numTotalTests":[0-9]*' | grep -o '[0-9]*' || echo "0")
        else
          PASSED=$(grep -o '[0-9]* passed' test-output.txt | grep -o '[0-9]*' || echo "0")
          TOTAL=$PASSED
        fi

        # カバレッジサマリーを取得
        if [ -f coverage/coverage-summary.json ]; then
          LINES=$(cat coverage/coverage-summary.json | grep -A4 '"total"' | grep '"lines"' -A1 | grep '"pct"' | grep -o '[0-9.]*' | head -1 || echo "N/A")
          BRANCHES=$(cat coverage/coverage-summary.json | grep -A4 '"total"' | grep '"branches"' -A1 | grep '"pct"' | grep -o '[0-9.]*' | head -1 || echo "N/A")
          FUNCS=$(cat coverage/coverage-summary.json | grep -A4 '"total"' | grep '"functions"' -A1 | grep '"pct"' | grep -o '[0-9.]*' | head -1 || echo "N/A")
          SUMMARY="Lines: ${LINES}% | Branches: ${BRANCHES}% | Functions: ${FUNCS}%"
        else
          SUMMARY="Coverage data not available"
        fi

        # Tekton Results に書き出し
        echo -n "$SUMMARY" > $(results.coverage-summary.path)
        echo -n "$PASSED" > $(results.tests-passed.path)
        echo -n "$TOTAL" > $(results.tests-total.path)

        echo ""
        echo "📊 Coverage Summary: $SUMMARY"
        echo "✅ Tests: $PASSED/$TOTAL passed"
