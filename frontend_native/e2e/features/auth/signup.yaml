appId: con.example.awesome
name: ユーザー登録
onFlowStart:
  - runScript: ../../scripts/reset_backend.js
---
# Given: アプリを起動してサインイン画面を表示
- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    file: ../../flows/wait_visible.yaml
    env:
      VISIBLE_TEXT: "Sign In"

# When: サインアップ画面に遷移してユーザー登録
- tapOn:
    id: signin-signup-link
- runFlow:
    file: ../../flows/wait_visible.yaml
    env:
      VISIBLE_TEXT: "Sign Up"
- tapOn:
    id: signup-email
- inputText:
    text: "maestro@example.com"
    delayBetweenKeystrokes: 0
- tapOn:
    id: signup-password
- inputText:
    text: "SecurePassword123"
    delayBetweenKeystrokes: 0
- tapOn:
    id: signup-submit
- tapOn:
    text: "OK"

# Then: ユーザー一覧画面に遷移し、登録したユーザーが表示される
- runFlow:
    file: ../../flows/wait_visible.yaml
    env:
      VISIBLE_TEXT: "ユーザー一覧"
- runFlow:
    file: ../../flows/wait_visible.yaml
    env:
      VISIBLE_TEXT: "maestro@example.com"
