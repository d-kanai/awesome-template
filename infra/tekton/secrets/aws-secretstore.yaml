# AWS Secrets Manager 接続設定
# OpenShift/EKS に External Secrets Operator をインストール後に適用
#
# 前提:
#   1. ESO インストール: helm install external-secrets external-secrets/external-secrets
#   2. IRSA or Pod Identity で AWS 認証設定済み
#
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-1  # 東京リージョン
      # IRSA を使う場合は auth 不要 (Pod の ServiceAccount で認証)
