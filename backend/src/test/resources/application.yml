spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:migration
    placeholders:
      create_pgcrypto_extension: ''
      users_id_uuid_clause: ''
  jooq:
    sql-dialect: H2

server:
  port: 8080
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized

app:
  env: TEST
  kafka:
    enabled: false
  jwt:
    secret: test-secret-key-that-is-at-least-256-bits-long-for-hs256
    expiration-hours: 720
    cookie:
      name: accessToken
      http-only: true
      secure: false
      same-site: Lax
      max-age-seconds: 2592000
  cors:
    allowed-origins: http://localhost:3000
  email:
    from: noreply@test.example.com
    reply-to: support@test.example.com
  mockoon:
    enabled: false
    api-url: http://localhost:3002
  external-api:
    base-url: http://localhost:3002

logging:
  level:
    root: WARN
    org.flywaydb.core: WARN
    com.example.demo: INFO
    org.jooq.tools.LoggerListener: DEBUG
