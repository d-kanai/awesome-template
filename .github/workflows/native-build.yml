# 🏗️ このワークフローは React Native アプリの Android APK をビルドします
name: Native Build

on:
  workflow_call:
    secrets:
      EXPO_TOKEN:
        required: true
    outputs:
      apk_url:
        description: "Built APK download URL"
        value: ${{ jobs.build.outputs.apk_url }}
      build_id:
        description: "EAS Build ID"
        value: ${{ jobs.build.outputs.build_id }}
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK with EAS
    runs-on: ubuntu-latest
    outputs:
      apk_url: ${{ steps.wait-build.outputs.apk_url }}
      build_id: ${{ steps.eas-build.outputs.build_id }}

    steps:
      # ✅ リポジトリ全体をチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 📦 Node.js セットアップ
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 🔧 pnpm セットアップ
      - name: Setup pnpm
        run: corepack enable

      # 📥 依存関係をインストール
      - name: Install dependencies
        run: |
          cd frontend_native
          pnpm install --frozen-lockfile
          pnpm add -D expo-dev-client

      # 🏗️ EAS Build (APK)
      - name: Build Android APK with EAS
        run: |
          cd frontend_native
          # ビルドを開始し、出力からビルドIDを抽出
          BUILD_OUTPUT=$(npx eas-cli build --platform android --profile preview --non-interactive --no-wait 2>&1)
          echo "$BUILD_OUTPUT"
          BUILD_ID=$(echo "$BUILD_OUTPUT" | grep -oP 'https://expo.dev/accounts/[^/]+/projects/[^/]+/builds/\K[a-f0-9-]+' | head -1)

          if [ -z "$BUILD_ID" ]; then
            echo "Failed to extract build ID from output"
            exit 1
          fi

          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build ID: $BUILD_ID"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        id: eas-build

      # ⏳ ビルド完了を待機
      - name: Wait for EAS build to complete
        run: |
          cd frontend_native
          BUILD_ID="${{ steps.eas-build.outputs.build_id }}"
          echo "Waiting for build: $BUILD_ID"

          # ビルドが完了するまで待機（最大30分）
          for i in {1..60}; do
            STATUS=$(npx eas-cli build:view $BUILD_ID --json 2>/dev/null | jq -r '.status' || echo "PENDING")
            echo "Build status: $STATUS (attempt $i/60)"

            if [ "$STATUS" = "FINISHED" ]; then
              echo "Build completed successfully"
              APK_URL=$(npx eas-cli build:view $BUILD_ID --json | jq -r '.artifacts.buildUrl')
              echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
              break
            elif [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "Build failed with status: $STATUS"
              exit 1
            fi

            sleep 30
          done
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        id: wait-build

      # 📄 ビルド結果を Step Summary に表示
      - name: Publish build summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### 🏗️ Native Build Successful

          - **Build ID**: \`${{ steps.eas-build.outputs.build_id }}\`
          - **APK Download URL**: ${{ steps.wait-build.outputs.apk_url }}
          - **Built at**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF
