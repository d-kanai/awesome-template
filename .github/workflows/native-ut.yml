name: Native Unit Tests

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "frontend_native/**"
  pull_request:
    branches: ["main"]
    paths:
      - "frontend_native/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend_native/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd frontend_native
          pnpm install --frozen-lockfile

      - name: Run native tests
        run: |
          cd frontend_native
          pnpm test -- --ci --coverage

      - name: Upload native coverage report
        uses: actions/upload-artifact@v4
        with:
          name: native-coverage-report
          path: frontend_native/coverage/
          retention-days: 7
