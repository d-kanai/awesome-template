# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🔍 Web Lint Task
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 📦 TypeScript 型チェック + Biome リント を実行
# 📍 git-clone Task の後に実行
#
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: web-lint
spec:
  params:
    - name: pnpm-version
      type: string
      default: "10.10.0"
      description: "📦 pnpm バージョン"

  # 🗂️ ソースコードを受け取る workspace
  workspaces:
    - name: source
      description: "クローン済みソースコード"

  steps:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # 📦 Step 1: Install Dependencies
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: install-deps
      image: node:22.21.1-alpine
      script: |
        #!/bin/sh
        set -e
        cd $(workspaces.source.path)/source/frontend_web
        corepack enable && corepack prepare pnpm@$(params.pnpm-version) --activate
        echo "📦 Installing dependencies..."
        pnpm install --frozen-lockfile
        echo "✅ Dependencies installed!"

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # 🔎 Step 2: TypeScript Type Check
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: typecheck
      image: node:22.21.1-alpine
      script: |
        #!/bin/sh
        set -e
        cd $(workspaces.source.path)/source/frontend_web
        corepack enable && corepack prepare pnpm@$(params.pnpm-version) --activate
        echo "🔎 Running TypeScript type check..."
        pnpm typecheck
        echo "✅ Type check passed!"

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # 🧹 Step 3: Biome Lint Check
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: biome-check
      image: node:22.21.1-alpine
      script: |
        #!/bin/sh
        set -e
        cd $(workspaces.source.path)/source/frontend_web
        corepack enable && corepack prepare pnpm@$(params.pnpm-version) --activate
        echo "🧹 Running Biome lint check..."
        pnpm biome check
        echo "✅ Biome check passed!"
