# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ☁️  本番用 ExternalSecret
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 🔄 AWS Secrets Manager から Kubernetes Secret へ自動同期
#
# 📋 前提条件:
#   1. External Secrets Operator がインストール済み
#   2. ClusterSecretStore (aws-secretstore.yaml) が作成済み
#   3. AWS Secrets Manager に Secret が登録済み
#
# 🗄️ AWS側の Secret 形式 (JSON):
# {
#   "ANALYZE": "false",
#   "NEXT_PUBLIC_API_BASE_URL": "https://api.example.com",
#   "NEXT_PUBLIC_API_MOCK_MODE": "false",
#   "NEXT_PUBLIC_API_TIMEOUT_MS": "30000",
#   "NEXT_PUBLIC_API_SLOW_THRESHOLD_MS": "3000",
#   "NODE_ENV": "production",
#   "LOG_LEVEL": "info"
# }
#
# 使い方:
#   kubectl apply -f infra/tekton/secrets/prod.yaml
#
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: web-build-env
  namespace: tekton-pipelines  # 🎯 Tekton が動く namespace
spec:
  # ⏰ 同期間隔 (AWS → K8s)
  refreshInterval: 1h  # 1時間ごとに最新値を取得

  # 🔗 接続先の SecretStore
  secretStoreRef:
    name: aws-secrets-manager      # ClusterSecretStore 名
    kind: ClusterSecretStore       # クラスタ全体で共有

  # 🎯 生成される Kubernetes Secret の設定
  target:
    name: web-build-env            # 生成される K8s Secret 名
    creationPolicy: Owner          # ExternalSecret 削除時に Secret も削除

  # 📦 AWS Secrets Manager からのデータ取得
  dataFrom:
    - extract:
        # 🔑 AWS Secrets Manager のキー名
        # 形式: {環境}/{プロジェクト}/{用途}
        key: prod/awesome-template/web-build
