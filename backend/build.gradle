import org.gradle.api.plugins.quality.Checkstyle

buildscript {
    dependencies {
        classpath 'org.flywaydb:flyway-database-postgresql:11.1.0'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'nu.studer.jooq' version '9.0'
    id 'org.flywaydb.flyway' version '11.1.0'
    id 'jacoco'
    id 'org.springdoc.openapi-gradle-plugin' version '1.8.0'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '6.22.0'
}

openApi {
    apiDocsUrl = 'http://localhost:8080/v3/api-docs'
    outputDir = file("$projectDir/openapi")
    outputFileName = 'openapi.json'
    waitTimeInSeconds = 10
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    main {
        resources {
            srcDirs += [
                'src/main/java/com/example/demo/features/user/db',
                'src/main/java/com/example/demo/features/auth/db',
                'src/main/java/com/example/demo/shared/db'
            ]
        }
    }
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.modulith:spring-modulith-bom:2.0.0'
    }
}

dependencies {
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    jooqGenerator 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'com.h2database:h2'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'org.springframework.modulith:spring-modulith-docs'
}

jooq {
    version = dependencyManagement.importedProperties['jooq.version']
    configurations {
        main {
            generationTool {
                logging = org.jooq.meta.jaxb.Logging.WARN
                jdbc {
                    driver = 'org.postgresql.Driver'
                    url = 'jdbc:postgresql://localhost:5432/demodb'
                    user = 'demo'
                    password = 'demo123'
                }
                generator {
                    name = 'org.jooq.codegen.DefaultGenerator'
                    database {
                        name = 'org.jooq.meta.postgres.PostgresDatabase'
                        inputSchema = 'public'
                    }
                    generate {
                        pojos = false
                        daos = false
                    }
                    target {
                        packageName = 'com.example.demo.shared.jooq'
                        directory = layout.buildDirectory.dir('generated-jooq').get().asFile.absolutePath
                    }
                }
            }
        }
    }
}

flyway {
    url = 'jdbc:postgresql://localhost:5432/demodb'
    user = 'demo'
    password = 'demo123'
    schemas = ['public']
    baselineOnMigrate = true
    cleanDisabled = false
    locations = [
        'filesystem:src/main/java/com/example/demo/features/user/db/migration',
        'filesystem:src/main/java/com/example/demo/features/auth/db/migration',
        'filesystem:src/main/java/com/example/demo/shared/db/migration'
    ]
    placeholders = [
        create_pgcrypto_extension: 'CREATE EXTENSION IF NOT EXISTS "pgcrypto";',
        users_id_uuid_clause: ' DEFAULT gen_random_uuid()'
    ]
}

// jOOQ の生成物は src/main/java/com/example/demo/shared/jooq に配置され、
// Git 管理下に置き、Docker ビルド時に再生成せずに利用する

tasks.named('compileJava') {
    dependsOn tasks.named('generateJooq')
}

tasks.named('generateJooq') {
    dependsOn tasks.named('flywayMigrate')

    doLast {
        // build/generated-jooq から src/main/java にコピー
        copy {
            from layout.buildDirectory.dir('generated-jooq')
            into 'src/main/java'
        }
        // 重複クラスを避けるため build/generated-jooq を削除
        delete layout.buildDirectory.dir('generated-jooq')
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
        showExceptions = true
        exceptionFormat = 'short'
        showStandardStreams = false
    }
    jacoco {
        excludes = [
            'com/example/demo/shared/jooq/**',
            'com/example/demo/DemoApplication*'
        ]
    }
}

jacoco {
    toolVersion = "0.8.13"
}

def readFileProperty = { String propertyName ->
    if (!project.hasProperty(propertyName)) {
        return []
    }

    project.property(propertyName)
        .toString()
        .split(/[;:]/)
        .collect { it.trim() }
        .findAll { !it.isEmpty() }
        .collect { file(it) }
        .findAll { it.exists() }
}

def checkstyleMainFilesOverride = readFileProperty('checkstyleMainFiles')
def checkstyleTestFilesOverride = readFileProperty('checkstyleTestFiles')
def spotlessFilesOverride = readFileProperty('spotlessFiles')

checkstyle {
    toolVersion = '10.12.4'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}

tasks.withType(Checkstyle).configureEach {
    exclude('**/build/generated-src/**')
    exclude('**/com/example/demo/shared/jooq/**')
}

tasks.named('checkstyleMain').configure {
    if (!checkstyleMainFilesOverride.isEmpty()) {
        source = files(checkstyleMainFilesOverride)
        include('**/*.java')
    }
}

tasks.named('checkstyleTest').configure {
    if (!checkstyleTestFilesOverride.isEmpty()) {
        source = files(checkstyleTestFilesOverride)
        include('**/*.java')
    }
}

tasks.named('check') {
    dependsOn tasks.named('checkstyleMain')
    dependsOn tasks.named('checkstyleTest')
}

spotless {
    java {
        if (!spotlessFilesOverride.isEmpty()) {
            target spotlessFilesOverride
        } else {
            target 'src/**/*.java'
            targetExclude 'src/main/java/com/example/demo/shared/jooq/**'
        }
        googleJavaFormat('1.17.0')
        removeUnusedImports()
    }
}

tasks.named('spotlessJava') {
    dependsOn tasks.named('generateJooq')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir("reports/jacoco/test")
    }
    classDirectories.setFrom(
        files(classDirectories.files.collect { dir ->
            fileTree(dir: dir, exclude: [
                'com/example/demo/shared/jooq/**',
                'com/example/demo/DemoApplication*'
            ])
        })
    )
}

tasks.register('bootRunTest', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Run the application with the test Spring profile'
    mainClass.set('com.example.demo.DemoApplication')
    classpath = sourceSets.main.runtimeClasspath
    environment('SPRING_PROFILES_ACTIVE', 'test')
}
